<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign Up for Triva</title>
    </head>
    <body>
        <h1>Create your Triva account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
        <p> Already have an account? <a href="{% url 'login' %}">Log in here</a>.
        </p>
    </body>
</html>
