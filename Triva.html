 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triva Chat  </title>

  <style>
   *{
   box-sizing: border-box;
   }
   body {
    margin:40px auto; 
    font-family: Arial,  sans-serif;
    background:#0b0b0b;
    color:white;
    height:100vh;
    display:flex;
    flex-direction: column;
   }

   nav {
    height:65px;
    background:#000;

    display: flex;
    align-items:center;
    justify-content: space-between ;

    padding :0 25px;

    border-bottom:1px solid #222;

   }
   .logo{
    font-size:22px;
    font-weight:bold;

   }
   nav a {
    color:white;
    text-decoration:none;
    margin-left:20px;

   }
nav a:hover{
  color:#1683ff;

}

.chat-container {
  flex:1;
  display:flex;
  flex-direction:column;

  max-width:1000px;
  width: 100%;

  margin:auto;
}
.chat-header {
 padding : 20px;
 border-bottom:1px solid #222;
}
 .chat-header h1{
 margin:0;
 font-size: 24px;
 }

 .chat-header p{
  color:#aaa;
   margin-bottom : 0;
 }
 #chat-box{
  flex:1;
  overflow-y:auto;
  padding:25px;
 }
 .message{
  max-width:75%;
  padding: 14px 18px;
  margin-bottom:15px ;

  border-radius:12px;
  
  line-height: 1.5;
 }
 
 .user-message {
 background:#1683ff;
 margin-left:auto;

 }
.Triva-message {
  background: #202020;
  margin-right: auto;
}  
.input-area {
  padding:20px;
  border-top:1px solid #222;
  background:#0b0b0b;
}
 
 .bottom-row {
display: flex;
gap:10px;

 }
 #message {
  flex:1;

  background: #171717;
  color:white;

  border:1px solid #333;
  border-radius:8px;

  padding:14px;
  outline:none;


 }
 #files{
  display:none;

 }
 .file-button{
  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 16px;
  
  background:#202020;
  border:1px solid #333;

  border-radius:8px;
  cursor:pointer;


 }
 .file-button:hover {
  background: #303030;

 }
  button {
    background:#1683ff;
    color:white;
   
    border:none;
    border-radius:8px;

    padding: 0 20px;

    cursor:pointer;

}
button:hover{
  background:#006bd6;
}
.selected-file{
 font-size: 13px;
 color:#aaa;
 margin-bottom:8px;
}

@media (max-width:600px){

  .nav-links{
    display:none;
  }
.message {
  max-width:90%;

}
.bottom-row {
  flex-wrap:wrap;

}

#message{
  width:100%;
  flex-basis:100%;
        }
      }
 </style>

</head>
<body>
  <nav>
  
     <div class="logo">
      Triva Hub
    </div>
    <div class="nav-links ">
      <a href="Trivahub.html">Home</a>
      <a href="Triva.html">Chat with Triva</a>
       <a href="about.html">About</a>
  </div>
  
</nav>

<main class="chat-container">
  <div class="chat-header">
    <h1>Triva </h1>
    <p>
      Upload a file or provide a folder for Triva to  analyze.
    </p>

  </div>
  <div id="chat-box">
    <div class="message Triva-message">
     Welcome to Triva AI
     <br></br>
     To use Triva upload a file or folder  
     Then ask your question.

    </div>
  </div>
  <div class="input-area">
    <div
    id="selected-file"
    class="selected-file"
    >
    No file selected 
  </div>
    
    <div class="bottom-row">
      <!-- Upload Button-->
      <label 
      for="files" 
      class="file-button">
      Upload Files
      </label>
      
      <input
      type="file"
      id="files"
      multiple
      onchange="showFiles()"
      >
      <input
      type="text"
      id="message"
      placeholder="Ask Triva about your source... "
      >
      <button onclick="sendMessage()">
        Send
      </button>
      </div>
    </div>
</main>
<script>

  let selectedFiles = [ ];

  function showFiles() {
   
    const fileInput=
      document.getElementById("files");
    
     selectedFiles = 
      Array.from(fileInput.files);
  
    const display = 
    document.getElementById("selected-file");
    
    if (selectedFiles.length > 0) {
      display.textContent =
     selectedFiles.length +  "file(s) selected";
     
}else{
  display.textContent=
  "No file seleceted";


    }
  }

   function addMessage(text, type) {
       const chatBox =
       document.getElementById("chat-box");

       const message = 
       document.createElement("div");

       message.className = 
       "message " + type;

       message.textContent = 
       text;

       chatBox.appendChild(message);

       chatBox.scrollTop=
       chatBox.scrollHeight;
  

  }
  async function sendMessage() {
    
   const messageInput =
    document.getElementById("message");

 

    const message =
    messageInput.value.trim();
    
  


    /*
    Triva requires a file  or folder 
    */

    if(selectedFiles.length===0) {
    addMessage(
    "Please upload a file or folder  before asking Triva a question.",
      "Triva-message"
    );

    return;
   
  } 
   if(!message){
    addMessage(
    "Please enter a question for Triva.",
    "Triva-message"

   );
   return;
   } 
   addMessage(
    message,
    "user-message"
   );

   messageInput.value="";

   const formData =
   new FormData();
   
   formData.append(
    "message",
    message
   );
    selectedFiles.forEach(function(file) {
    
      formData.append(
        "files",
      file

      );
   });
  
   
  

   
try{

  const response =
  await fetch("/chat", {
      
    method:"POST",
     body:formData
    
      
  });
 const data = 
 await response.json();
 
 if(data.response ) {
  addMessage(
    data.response,
    "Triva-message"

  );

 }else{
  addMessage(
      data.error || "Something went wrong.",
      "Triva-message"
 ); 
}
} catch (error) {
  addMessage(
    "Triva could not connect to the server.",
    "Triva-message"
);

        } 
   
      }

   
</script>
</body>
</html>
