!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log In to Triva</title>
    </head>
    <body>
   <h1>Log in to Triva</h1>
       {%if error%}
       <p>{{ error}}</p>

          {% endif %}

          <form method ="post">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input 
                   type="text"
                     id="username"
                        name="username"
                        required>
            
            <label for="password">Password:</label>
            <input
                   type="password"
                     id="password"         
                        name="password"
                        required>
            <button type="submit">Log In</button>
          </form>
        <p>
            Do you need an account? <a href="{% url 'signup' %}">Sign up here</a>.
        </p>

    </body>
</html>
